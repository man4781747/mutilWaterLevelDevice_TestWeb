# build 後經 IAP 通道，以部署專用的 SSH 金鑰把網頁部署到 GCP VM（設定步驟見 deploy/README.md）
# 本 repo 是公開的：專案、VM、路徑、金鑰等資訊一律放在 Secrets，不寫在這裡（Secrets 在 log 中會被遮蔽）
name: 部署到 GCP VM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # Workload Identity Federation 換 GCP 短期憑證用

# 同時只跑一個部署，後來的排隊，不中斷正在部署的
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_ZONE: ${{ secrets.GCP_ZONE }}
      GCP_VM_NAME: ${{ secrets.GCP_VM_NAME }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      TUNNEL_PORT: 2222
      REMOTE_ARCHIVE: /tmp/cloud-web-dist-${{ github.run_id }}.tar.gz
      REMOTE_SCRIPT: /tmp/cloud-web-deploy-${{ github.run_id }}.sh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: 安裝套件
        run: npm ci

      - name: 編譯
        run: npm run build

      - name: 打包
        run: tar -czf cloud-web-dist.tar.gz -C dist .

      - name: 登入 GCP（Workload Identity Federation）
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: 準備 SSH 金鑰
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: 開啟 IAP 通道
        run: |
          gcloud compute start-iap-tunnel "$GCP_VM_NAME" 22 \
            --local-host-port "localhost:$TUNNEL_PORT" \
            --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" > iap-tunnel.log 2>&1 &
          # 等通道可以連線，最多 30 秒
          for i in $(seq 1 30); do
            if nc -z localhost "$TUNNEL_PORT"; then
              echo "IAP 通道已開啟"
              exit 0
            fi
            sleep 1
          done
          echo "IAP 通道 30 秒內沒有開啟" >&2
          cat iap-tunnel.log >&2
          exit 1

      # 經 IAP 通道連線前，Google 已驗證過服務帳號與目標 VM，所以不另外核對 host key
      - name: 上傳到 VM
        run: |
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR"
          scp $SSH_OPTS -P "$TUNNEL_PORT" cloud-web-dist.tar.gz "$DEPLOY_SSH_USER@localhost:$REMOTE_ARCHIVE"
          scp $SSH_OPTS -P "$TUNNEL_PORT" deploy/remote-deploy.sh "$DEPLOY_SSH_USER@localhost:$REMOTE_SCRIPT"

      - name: 換上新版
        run: |
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR"
          ssh $SSH_OPTS -p "$TUNNEL_PORT" "$DEPLOY_SSH_USER@localhost" \
            "bash '$REMOTE_SCRIPT' '$REMOTE_ARCHIVE' '$DEPLOY_PATH'; status=\$?; rm -f '$REMOTE_SCRIPT'; exit \$status"

      - name: 清除金鑰
        if: always()
        run: rm -f ~/.ssh/deploy_key
